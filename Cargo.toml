[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.13.2"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/ianclemence/devd"
authors = ["Ian Clemence <batricupid@gmail.com>"]
description = "Agent-native local development environment manager: managed runtimes, sites, local HTTPS, Git, and one capability API for humans and agents."
keywords = ["development-environment", "php", "mcp", "agents", "runtime-manager"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "net", "io-util", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tempfile = "3"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5", features = ["util"] }
open = "5"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
rcgen = "0.13"
base64 = "0.22"
time = "0.3"

devd-core = { path = "crates/devd-core" }

[workspace.lints.clippy]
# Eight positional arguments is a call nobody can read; take a struct.
too_many_arguments = "deny"
# Tests and settings builders read better as `let mut s = Settings::default(); s.x = ..;`.
field_reassign_with_default = "allow"

[workspace.lints.rust]
# A warning is a decision nobody made. These fail the build instead of printing:
# dead code, unused imports and variables, and unused results. Suppressing one
# with #[allow] has to be done where a reviewer will see it.
unused = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

