id: codeigniter
name: CodeIgniter 4
language: php
category: web
summary: Lightweight PHP framework.
docs:
  - {title: Installation, url: "https://codeigniter.com/user_guide/installation/installing_composer.html"}
verified: {method: docs, against: "codeigniter4/appstarter v4.7 on Packagist", date: "2026-10-20"}
runtime: php
package_managers: [composer]
versions:
  - {id: "4", label: CodeIgniter 4 (latest), value: "^4.0", default: true, requires: [{tool: php, min: "8.2"}, {tool: composer, min: "2.2"}]}
init:
  install_toggle: true
  steps:
    - id: scaffold
      title: Create the project with Composer
      network: true
      extensible: true
      needs: [php, composer]
      env: {COMPOSER_NO_INTERACTION: "1"}
      run:
        - composer
        - create-project
        - --no-interaction
        - {when: {option: install, equals: false}, args: [--no-install]}
        - codeigniter4/appstarter
        - "{name}"
        - "{version}"
verify:
  files: [spark, composer.json, public/index.php]
  commands:
    - {title: spark boots, needs_install: true, needs: [php], run: [php, spark, --version]}
tasks:
  - {id: dev, title: Start the development server, kind: dev, long_running: true, port: 8080, run: [php, spark, serve], requires_file: spark}
  - {id: test, title: Run PHPUnit, kind: test, run: [vendor/bin/phpunit], requires_file: vendor/bin/phpunit}
  - {id: migrate, title: Run migrations, kind: migrate, risk: mutating, run: [php, spark, migrate], requires_file: spark}
  - {id: routes, title: List routes, kind: other, run: [php, spark, routes], requires_file: spark}
  - {id: install, title: Install dependencies, kind: install, risk: mutating, run: [composer, install], requires_file: composer.json}
detect:
  rules:
    - {dependency: codeigniter4/framework, weight: 7, evidence: codeigniter4/framework is a Composer dependency}
    - {file: spark, weight: 3, evidence: spark entry point}
structure: [app/, public/, writable/, spark, env]
conventions:
  - "Copy env to .env for local configuration; never commit .env."
exec:
  programs: [php, composer]
  destructive_args: [migrate:rollback, migrate:refresh, db:wipe]
