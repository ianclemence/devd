id: symfony
name: Symfony
language: php
category: web
summary: Component-based PHP framework.
docs:
  - {title: Installing & Setting up Symfony, url: "https://symfony.com/doc/current/setup.html"}
verified: {method: docs, against: "symfony/skeleton v7.4 / v8.1 on Packagist", date: "2026-10-20"}
runtime: php
package_managers: [composer]
versions:
  - {id: "7.4", label: Symfony 7.4 (LTS), value: "7.4.*", default: true, requires: [{tool: php, min: "8.2"}, {tool: composer, min: "2.2"}]}
  - {id: "8.1", label: Symfony 8.1, value: "8.1.*", requires: [{tool: php, min: "8.4"}, {tool: composer, min: "2.2"}]}
options:
  - {id: webapp, label: Full web application, kind: bool, default: true, help: "Adds the webapp pack (Twig, Doctrine, Forms, Security, Mailer...) as the Symfony setup guide describes. Off keeps the minimal skeleton."}
init:
  install_toggle: true
  steps:
    - id: scaffold
      title: Create the skeleton with Composer
      network: true
      extensible: true
      needs: [php, composer]
      env: {COMPOSER_NO_INTERACTION: "1"}
      run:
        - composer
        - create-project
        - --no-interaction
        - {when: {option: install, equals: false}, args: [--no-install]}
        - "symfony/skeleton:{version}"
        - "{name}"
    - id: webapp
      title: Add the webapp pack
      cwd: project
      network: true
      when: {option: webapp, equals: true}
      needs: [php, composer]
      env: {COMPOSER_NO_INTERACTION: "1"}
      run: [composer, require, --no-interaction, --no-progress, webapp]
verify:
  files: [bin/console, composer.json, public/index.php]
  commands:
    - {title: Console boots, needs_install: true, needs: [php], run: [php, bin/console, --version]}
tasks:
  - {id: dev, title: Start the PHP built-in server, kind: dev, long_running: true, port: 8000, run: [php, -S, "127.0.0.1:8000", -t, public], requires_file: public/index.php}
  - {id: test, title: Run PHPUnit, kind: test, run: [php, bin/phpunit], requires_file: bin/phpunit}
  - {id: console, title: List console commands, kind: other, run: [php, bin/console, list], requires_file: bin/console}
  - {id: migrate, title: Run Doctrine migrations, kind: migrate, risk: mutating, run: [php, bin/console, doctrine:migrations:migrate, --no-interaction], requires_file: bin/console}
  - {id: cache-clear, title: Clear the cache, kind: other, run: [php, bin/console, cache:clear], requires_file: bin/console}
  - {id: lint, title: Lint container, Twig and YAML, kind: lint, run: [php, bin/console, lint:container], requires_file: bin/console}
  - {id: install, title: Install dependencies, kind: install, risk: mutating, run: [composer, install], requires_file: composer.json}
detect:
  rules:
    - {dependency: symfony/framework-bundle, weight: 7, evidence: symfony/framework-bundle is a Composer dependency}
    - {file: bin/console, weight: 2, evidence: bin/console}
    - {file: symfony.lock, weight: 1, evidence: symfony.lock}
env:
  - {name: APP_SECRET, secret: true, required: true, help: Used for signing; keep it in .env.local.}
  - {name: DATABASE_URL, secret: true, help: Doctrine connection string; contains credentials.}
structure: [src/, config/, templates/, public/index.php, bin/console, .env]
conventions:
  - "Use `php bin/console make:*` (symfony/maker-bundle) to generate code."
  - "Put local overrides and secrets in .env.local, never in .env."
exec:
  programs: [php, composer, symfony]
  destructive_args: [doctrine:schema:drop, doctrine:database:drop, doctrine:fixtures:load, "--force"]
