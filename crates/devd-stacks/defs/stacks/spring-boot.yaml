id: spring-boot
name: Spring Boot
language: java
category: backend
summary: Java (or Kotlin) application framework, generated by Spring Initializr.
description: The project is downloaded from start.spring.io, the service behind the Spring Initializr UI, using its documented HTTP API. It includes the Maven or Gradle wrapper, so only a JDK is needed.
docs:
  - {title: Spring Initializr API, url: "https://docs.spring.io/initializr/docs/current/reference/html/#api-guide"}
  - {title: Spring Boot reference, url: "https://docs.spring.io/spring-boot/reference/"}
  - {title: Getting started, url: "https://docs.spring.io/spring-boot/tutorial/first-application/index.html"}
verified: {method: docs, against: "Spring Initializr API guide", date: "2026-10-20"}
runtime: java
package_managers: []
name_pattern: '^[a-z][a-z0-9-]{0,63}$'
name_hint: Lowercase letters, digits and hyphens; used as the artifact id.
versions:
  - {id: current, label: Current Spring Boot (start.spring.io default), value: "", default: true, requires: [{tool: java, min: "17", why: "Spring Boot 3 and later require Java 17+"}]}
options:
  - {id: build, label: Build tool, kind: select, default: maven-project, choices: [{value: maven-project, label: Maven}, {value: gradle-project, label: Gradle (Groovy DSL)}, {value: gradle-project-kotlin, label: Gradle (Kotlin DSL)}]}
  - {id: language, label: Language, kind: select, default: java, choices: [{value: java, label: Java}, {value: kotlin, label: Kotlin}, {value: groovy, label: Groovy}]}
  - {id: java_version, label: Java version, kind: select, default: "21", help: The bytecode level generated; the JDK you run must be at least this version., choices: [{value: "17", label: "17"}, {value: "21", label: "21"}, {value: "25", label: "25"}]}
  - {id: group_id, label: Group id, kind: text, default: com.example, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', help: Reverse domain name of your organisation.}
  - {id: dependencies, label: Dependencies, kind: multi, default: [web, actuator, devtools], help: Spring Initializr dependency ids., choices: [{value: web, label: Spring Web}, {value: webflux, label: Spring Reactive Web}, {value: thymeleaf, label: Thymeleaf}, {value: data-jpa, label: Spring Data JPA}, {value: data-redis, label: Spring Data Redis}, {value: security, label: Spring Security}, {value: validation, label: Validation}, {value: actuator, label: Actuator}, {value: devtools, label: Developer tools}, {value: lombok, label: Lombok}, {value: flyway, label: Flyway migrations}, {value: postgresql, label: PostgreSQL driver}, {value: mysql, label: MySQL driver}, {value: h2, label: H2 database}, {value: mail, label: Mail}, {value: docker-compose, label: Docker Compose support}, {value: testcontainers, label: Testcontainers}]}
init:
  creates_dir: true
  install_toggle: false
  steps:
    - id: fetch
      title: Download the project from start.spring.io
      kind: fetch
      cwd: project
      network: true
      path: "https://start.spring.io/starter.zip?type={opt.build}&language={opt.language}&javaVersion={opt.java_version}&groupId={opt.group_id}&artifactId={name}&name={name}&dependencies={opt.dependencies}"
verify:
  files: [".gitignore"]
tasks:
  - {id: dev, title: Run the application (Maven), kind: dev, long_running: true, port: 8080, run: [./mvnw, spring-boot:run], requires_file: mvnw, needs: [java]}
  - {id: build, title: Package (Maven), kind: build, run: [./mvnw, -B, package], requires_file: mvnw, needs: [java]}
  - {id: test, title: Run tests (Maven), kind: test, run: [./mvnw, -B, test], requires_file: mvnw, needs: [java]}
  - {id: clean, title: Delete build output (Maven), kind: build, risk: mutating, run: [./mvnw, -B, clean], requires_file: mvnw, needs: [java]}
  - {id: dev-gradle, title: Run the application (Gradle), kind: dev, long_running: true, port: 8080, run: [./gradlew, bootRun], requires_file: gradlew, needs: [java]}
  - {id: build-gradle, title: Build (Gradle), kind: build, run: [./gradlew, build], requires_file: gradlew, needs: [java]}
  - {id: test-gradle, title: Run tests (Gradle), kind: test, run: [./gradlew, test], requires_file: gradlew, needs: [java]}
detect:
  rules:
    - {text: spring-boot, in_file: pom.xml, weight: 7, evidence: pom.xml references spring-boot}
    - {text: org.springframework.boot, in_file: build.gradle, weight: 7, evidence: build.gradle applies the Spring Boot plugin}
    - {text: org.springframework.boot, in_file: build.gradle.kts, weight: 7, evidence: build.gradle.kts applies the Spring Boot plugin}
    - {file: mvnw, weight: 1, evidence: Maven wrapper}
    - {file: gradlew, weight: 1, evidence: Gradle wrapper}
services:
  - {tool: postgresql, when: {option: dependencies, contains: postgresql}, why: PostgreSQL driver selected}
  - {tool: mysql, when: {option: dependencies, contains: mysql}, why: MySQL driver selected}
  - {tool: redis, when: {option: dependencies, contains: data-redis}, why: Spring Data Redis selected}
env:
  - {name: SPRING_DATASOURCE_PASSWORD, secret: true, help: Overrides spring.datasource.password.}
  - {name: JAVA_HOME, help: Selects the JDK used by the wrappers.}
structure: [pom.xml or build.gradle(.kts), src/main/java, src/main/resources/application.properties, src/test/java, mvnw or gradlew]
conventions:
  - "Always use the ./mvnw or ./gradlew wrapper, which pins the build tool version."
  - "Configuration lives in src/main/resources/application.properties; override secrets with environment variables."
exec:
  programs: [java, ./mvnw, ./gradlew, mvn, gradle, mvnw, gradlew]
  destructive_args: [flywayClean, "flyway:clean", deploy]
