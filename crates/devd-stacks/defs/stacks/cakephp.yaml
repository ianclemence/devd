id: cakephp
name: CakePHP
language: php
category: web
summary: Convention-over-configuration PHP framework.
docs:
  - {title: Installation, url: "https://book.cakephp.org/5/en/installation.html"}
verified: {method: docs, against: "cakephp/app 5.x on Packagist", date: "2026-10-20"}
runtime: php
package_managers: [composer]
versions:
  - {id: "5", label: CakePHP 5 (latest), value: "~5.0", default: true, requires: [{tool: php, min: "8.2"}, {tool: composer, min: "2.2"}]}
init:
  install_toggle: true
  steps:
    - id: scaffold
      title: Create the app with Composer
      network: true
      extensible: true
      needs: [php, composer]
      env: {COMPOSER_NO_INTERACTION: "1"}
      run:
        - composer
        - create-project
        - --prefer-dist
        - --no-interaction
        - {when: {option: install, equals: false}, args: [--no-install]}
        - "cakephp/app:{version}"
        - "{name}"
verify:
  files: [bin/cake, composer.json, webroot/index.php]
  commands:
    - {title: bin/cake boots, needs_install: true, needs: [php], run: [php, bin/cake.php, version]}
tasks:
  - {id: dev, title: Start the development server, kind: dev, long_running: true, port: 8765, run: [php, bin/cake.php, server], requires_file: bin/cake.php}
  - {id: test, title: Run PHPUnit, kind: test, run: [vendor/bin/phpunit], requires_file: vendor/bin/phpunit}
  - {id: migrate, title: Run migrations, kind: migrate, risk: mutating, run: [php, bin/cake.php, migrations, migrate], requires_file: bin/cake.php}
  - {id: routes, title: List routes, kind: other, run: [php, bin/cake.php, routes], requires_file: bin/cake.php}
  - {id: install, title: Install dependencies, kind: install, risk: mutating, run: [composer, install], requires_file: composer.json}
detect:
  rules:
    - {dependency: cakephp/cakephp, weight: 7, evidence: cakephp/cakephp is a Composer dependency}
    - {file: bin/cake.php, weight: 2, evidence: bin/cake.php}
structure: [src/, config/, templates/, webroot/, bin/cake.php]
conventions:
  - "Bake code with `bin/cake bake ...`."
exec:
  programs: [php, composer]
  destructive_args: [migrations rollback, "--force"]
