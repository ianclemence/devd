      <button type="button" class="health health-checking" id="health-chip" data-action="health-open" title="System health"></button>
    </div>
  </aside>

  <div class="content">
    <div class="crumbs" id="crumbs"></div>
    <nav class="subnav" id="subnav" hidden></nav>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading</div>
    </main>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search or run anything">
    <div class="palette-head">
      <input type="text" id="palette-input" placeholder="Search or run anything" autocomplete="off" spellcheck="false" aria-label="Search or run anything">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot" id="palette-foot"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <div class="modal-kicker" id="modal-kicker"></div>
        <h2 id="modal-title"></h2>
      </div>
      <span class="pill" id="modal-tier"></span>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <div class="modal-expiry" id="modal-expiry"></div>
      <div class="modal-buttons">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="button" class="btn btn-go" id="modal-confirm">Approve and run</button>
      </div>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" role="dialog" aria-label="Details" hidden>
  <div class="drawer-head">
    <span class="drawer-title" id="drawer-title"></span>
    <button type="button" class="btn btn-ghost" data-action="close-drawer">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

<script src="/vendor/xterm.js" defer></script>
<script src="/vendor/addon-fit.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
