<div class="shell" id="shell-frame">
  <nav class="shell-rail" id="shell-rail" aria-label="Main"></nav>
  <div class="shell-column">
    <header class="shell-topbar" id="shell-top"></header>
    <main class="shell-screen" id="screen" tabindex="-1">
      <div class="legacy content">
        <aside class="ctx-panel" id="panel" aria-label="This area" hidden></aside>
        <div class="panel-scrim" data-action="panel-toggle" aria-hidden="true"></div>
        <div class="main" id="main">
          <div class="loading">Loading</div>
        </div>
      </div>
    </main>
    <footer class="shell-status" id="shell-status"></footer>
  </div>
</div>
<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search or run anything">
    <div class="palette-head">
      <input type="text" id="palette-input" placeholder="Search or run anything" autocomplete="off" spellcheck="false" aria-label="Search or run anything">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot" id="palette-foot"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <div class="modal-kicker" id="modal-kicker"></div>
        <h2 id="modal-title"></h2>
      </div>
      <span class="pill" id="modal-tier"></span>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close this dialog" title="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <div class="modal-expiry" id="modal-expiry"></div>
      <div class="modal-buttons">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="button" class="btn btn-go" id="modal-confirm">Approve and run</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="dialog" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="modal-head"><span class="modal-icon" id="dialog-icon" aria-hidden="true"><svg class="icon"><use href="#i-info"></use></svg></span><div><h2 id="dialog-title"></h2></div><button type="button" class="modal-close" id="dialog-close" aria-label="Close this dialog" title="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button></div>
    <div class="modal-body">
      <div class="dialog-text" id="dialog-text"></div>
      <input type="text" class="input" id="dialog-input" autocomplete="off" spellcheck="false" hidden>
    </div>
    <div class="modal-foot">
      <div class="modal-buttons">
        <button type="button" class="btn" id="dialog-cancel">Cancel</button>
        <button type="button" class="btn btn-go" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>
</div>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" hidden>
  <div class="drawer-head">
    <span class="drawer-title" id="drawer-title"></span>
    <button type="button" class="btn btn-ghost drawer-close" data-action="close-drawer" aria-label="Close details">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="overlay picker-overlay" id="picker" hidden>
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" aria-describedby="picker-note">
    <div class="picker-head">
      <div class="picker-headings">
        <h2 id="picker-title">Choose a folder</h2>
        <p class="picker-note" id="picker-note">Move through your device and pick the folder that holds the project.</p>
      </div>
      <button type="button" class="btn btn-ghost" data-action="picker-close" aria-label="Close the folder picker">Close</button>
    </div>

    <div class="picker-bar">
      <button type="button" class="btn btn-ghost picker-up" id="picker-up" data-action="picker-up" aria-label="Go to the parent folder" disabled>Up</button>
      <nav class="picker-crumbs" id="picker-crumbs" aria-label="Path"></nav>
      <button type="button" class="btn" data-action="picker-native" id="picker-native" hidden>Open system dialog</button>
    </div>

    <div class="picker-places" id="picker-places" aria-label="Places"></div>

    <div class="picker-list" id="picker-list" role="listbox" aria-label="Folders" tabindex="-1"></div>

    <div class="picker-inspect" id="picker-inspect" aria-live="polite"></div>

    <div class="picker-foot">
      <label class="picker-path">
        <span class="sr-only">Folder path</span>
        <input type="text" id="picker-path-input" class="input mono" spellcheck="false" autocomplete="off" placeholder="Type a folder path and press Enter">
      </label>
      <div class="picker-buttons">
        <button type="button" class="btn" data-action="picker-cancel">Cancel</button>
        <button type="button" class="btn btn-go" id="picker-choose" data-action="picker-choose">Use this folder</button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="sr-only" id="live-polite" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="sr-only" id="live-assertive" role="alert" aria-live="assertive" aria-atomic="true"></div>
<div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
