[package]
name = "devd-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "devd's built-in agent: model providers, the official model catalogue, conversations, the inbox, approvals and file tools."

[dependencies]
devd-core = { path = "../devd-core" }
devd-genui = { path = "../devd-genui" }
devd-mcp = { path = "../devd-mcp" }
devd-stacks = { path = "../devd-stacks" }
devd-git = { path = "../devd-git" }
devd-services = { path = "../devd-services" }
devd-sites = { path = "../devd-sites" }
devd-runtime = { path = "../devd-runtime" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ureq.workspace = true
# The DevTools Protocol speaks WebSocket. A blocking client is the right shape:
# a capability call is one command and one reply, not a long-lived server task.
tungstenite = { version = "0.24", features = ["url"] }
chrono.workspace = true
regex = "1"
walkdir.workspace = true
base64.workspace = true
webpki-roots = "0.26"

[dev-dependencies]
tempfile.workspace = true
# The notification target and the queue that delivers it are tested from here,
# where a suggestion and a queued message meet.
devd-ops = { path = "../devd-ops" }

[lints]
workspace = true
