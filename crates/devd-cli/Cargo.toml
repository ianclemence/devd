[package]
name = "devd-cli"
description = "The `devd` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "devd"
path = "src/main.rs"

[dependencies]
devd-core = { workspace = true }
devd-bootstrap = { path = "../devd-bootstrap" }
devd-git = { path = "../devd-git" }
devd-runtime = { path = "../devd-runtime" }
devd-services = { path = "../devd-services" }
devd-sites = { path = "../devd-sites" }
devd-server = { path = "../devd-server" }
devd-mcp = { path = "../devd-mcp" }
devd-tui = { path = "../devd-tui" }
devd-workspace = { path = "../devd-workspace" }
devd-stacks = { path = "../devd-stacks" }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
open = { workspace = true }

[build-dependencies]
# Embeds the devd icon in the executable on Windows, so it does not show the
# default application icon in Explorer or on the taskbar.
embed-resource = "3"

[lints]
workspace = true
