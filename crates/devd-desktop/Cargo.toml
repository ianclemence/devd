[package]
name = "devd-desktop"
description = "The native devd desktop shell: a Tauri window over the existing devd server and UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "devd_desktop"
crate-type = ["rlib"]

[[bin]]
name = "devd-desktop"
path = "src/main.rs"

[dependencies]
devd-core = { workspace = true }
devd-bootstrap = { path = "../devd-bootstrap" }
devd-server = { path = "../devd-server" }

tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
open = { workspace = true }

# The native folder picker. On Windows it drives the common item dialog; on
# Linux it asks the desktop portal, so the shell needs no GTK at build time.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
