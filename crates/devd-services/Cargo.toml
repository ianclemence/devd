description = "Managed services for devd: nginx, the PHP FastCGI listener, MariaDB, the local certificate authority and generated web server configuration."

[dependencies]
devd-core = { path = "../devd-core" }
devd-runtime = { path = "../devd-runtime" }
serde.workspace = true
serde_json.workspace = true
