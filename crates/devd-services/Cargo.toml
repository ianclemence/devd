rcgen = { workspace = true, features = ["x509-parser"] }
uuid.workspace = true
hex.workspace = true
chrono.workspace = true
time = { workspace = true, features = ["formatting"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
